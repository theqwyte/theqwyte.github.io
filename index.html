<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qwyte</title>
<meta name="description" content="Qwyte — канал про Mortal Kombat. YouTube, TikTok, Telegram.">
<meta property="og:title" content="Qwyte">
<meta property="og:description" content="Канал про Mortal Kombat. Поднимись на башню.">
<meta name="theme-color" content="#06080c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2306080c'/%3E%3Cpath d='M32 6 L44 24 H20 Z' fill='%232a2e36' stroke='%23aeb6c4' stroke-width='2'/%3E%3Crect x='22' y='26' width='20' height='34' fill='%233a3f49'/%3E%3Cpath d='M28 44 V38 a4 4 0 0 1 8 0 V44 Z' fill='%23b0141f'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="tower.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#06080c;
    --steel:#aeb6c4;
    --bone:#dfe3ea;
    --blood:#b0141f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--void);scroll-snap-type:y proximity}
  body{
    min-height:100%;
    color:var(--bone);
    font-family:"Cinzel",Georgia,serif;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }

  /* ---------- sky: static, drawn once ---------- */
  .sky{
    position:fixed;left:0;top:0;width:100%;height:100lvh;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 30% at 30% 22%,rgba(10,13,20,.7),transparent 70%),
      radial-gradient(ellipse 70% 45% at 24% 16%,rgba(140,158,192,.16),transparent 65%),
      linear-gradient(180deg,#0d1320 0%,#080b12 50%,#030406 100%);
  }
  .moon{
    position:absolute;left:9%;top:14%;
    width:min(24vw,118px);aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle at 30% 40%,rgba(90,98,112,.55) 0 9%,transparent 10%),
      radial-gradient(circle at 62% 62%,rgba(90,98,112,.45) 0 13%,transparent 14%),
      radial-gradient(circle at 58% 28%,rgba(90,98,112,.35) 0 6%,transparent 7%),
      radial-gradient(circle at 40% 38%,#eef0f4 0%,#c3c9d3 50%,#8b93a2 100%);
    opacity:.5;
    box-shadow:0 0 90px 30px rgba(160,176,206,.1);
  }
  .peaks{position:absolute;left:0;bottom:0;width:100%;height:42%}

  /* ---------- page ---------- */
  main{
    position:relative;z-index:1;
    width:min(100%,500px);margin:0 auto;
    padding-top:calc(env(safe-area-inset-top) + 26px);
    padding-bottom:calc(env(safe-area-inset-bottom) + 40px);
  }
  header{text-align:center;margin-bottom:-6%}
  h1{
    font-weight:700;
    font-size:clamp(30px,9vw,46px);
    letter-spacing:.42em;padding-left:.42em;line-height:1;
    text-shadow:0 2px 0 #000,0 0 26px rgba(0,0,0,.9);
  }
  header i{display:block;width:44px;height:2px;margin:12px auto 0;background:var(--blood)}

  .tower{
    position:relative;
    transform-origin:50% 50%;
    animation:rise 1.1s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  .tower img{
    display:block;width:100%;height:auto;
    -webkit-mask-image:linear-gradient(180deg,#000 92%,transparent);
            mask-image:linear-gradient(180deg,#000 92%,transparent);
    pointer-events:none;user-select:none;-webkit-user-select:none;
  }
  .tower.dive{
    animation:none;
    transition:transform .75s cubic-bezier(.6,0,.85,.35);
    will-change:transform;
  }

  /* ---------- one fight per floor ---------- */
  .fl{
    position:absolute;
    display:block;
    text-decoration:none;color:inherit;
    scroll-snap-align:center;
    outline:none;
  }
  .fl .arch{
    position:absolute;inset:0;
    border-radius:999px 999px 2px 2px;
    overflow:hidden;
    background:radial-gradient(ellipse 75% 55% at 50% 46%,var(--c) 0%,transparent 72%);
    opacity:.18;
    transition:opacity .45s;
  }
  .fl .arch::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:18%;
    background:linear-gradient(180deg,transparent,var(--c));
    opacity:.5;
  }
  .fl svg{
    position:absolute;left:50%;top:44%;width:74%;
    transform:translate(-50%,-50%);
    filter:grayscale(1) brightness(.55);
    transition:filter .45s,transform .45s;
  }
  .fl.on .arch{opacity:.85}
  .fl.on svg{filter:none;transform:translate(-50%,-50%) scale(1.06)}
  .fl:active svg{transform:translate(-50%,-50%) scale(.94)}

  .plate{
    position:absolute;left:50%;top:calc(100% + 4px);
    transform:translateX(-50%);
    white-space:nowrap;
    padding:6px 16px 7px;
    font-size:clamp(12px,3.4vw,15px);font-weight:700;letter-spacing:.06em;
    color:#8d95a3;
    background:linear-gradient(180deg,#2c313a 0%,#14171c 55%,#0b0d10 100%);
    border:1px solid #4a505b;border-top-color:#8d95a3;
    box-shadow:0 6px 14px rgba(0,0,0,.6);
    transition:color .45s,border-color .45s;
  }
  .plate::before,.plate::after{
    content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;
    background:#4a505b;transform:rotate(45deg);
  }
  .plate::before{left:6px}
  .plate::after{right:6px}
  .fl.on .plate{color:var(--bone);border-color:var(--c);border-top-color:var(--c)}
  .fl.on .plate::before,.fl.on .plate::after{background:var(--c)}
  .fl:focus-visible .plate{outline:2px solid var(--bone);outline-offset:3px}

  footer{text-align:center;font-size:12px;color:#596070;margin-top:6px;padding-bottom:28vh}

  /* ---------- floor pips ---------- */
  .pips{
    position:fixed;z-index:3;
    right:max(6px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:4px;
  }
  .pips button{
    width:34px;height:34px;border:0;background:none;cursor:pointer;
    display:grid;place-items:center;border-radius:50%;
  }
  .pips i{
    width:9px;height:9px;transform:rotate(45deg);
    border:1.5px solid var(--steel);opacity:.5;
    transition:all .35s;
  }
  .pips .on i{background:var(--c);border-color:var(--c);opacity:1;transform:rotate(45deg) scale(1.4)}
  .pips button:focus-visible{outline:2px solid var(--bone)}

  .flash{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,#fff 0%,var(--c,#fff) 28%,#000 80%);
    opacity:0;transition:opacity .4s ease-in;
  }
  .flash.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="moon"></div>
  <svg class="peaks" viewBox="0 0 400 300" preserveAspectRatio="none">
    <path d="M0 150 L30 120 L52 138 L80 92 L104 128 L130 108 L150 134 L180 84 L214 130 L240 112 L262 140 L300 96 L330 132 L356 110 L400 140 V300 H0Z" fill="#0b0f17"/>
    <path d="M0 210 L40 170 L70 196 L110 160 L150 204 L196 176 L240 214 L286 168 L320 200 L360 172 L400 196 V300 H0Z" fill="#07090e"/>
  </svg>
</div>

<main>
  <header>
    <h1>Qwyte</h1>
    <i></i>
  </header>

  <div class="tower" id="tower">
    <img src="tower.webp" width="960" height="2838" alt="">
    <!-- floors are placed over the arches of the rendered tower; the boss sits on top -->
    <a class="fl" data-i="3" style="left:29.86%;top:25.53%;width:20.47%;height:11.77%;--c:#ff2a3d" href="https://youtube.com/@qwyte">
      <span class="arch"></span>
      <svg viewBox="-50 -50 100 100" aria-hidden="true"><rect x="-38" y="-27" width="76" height="54" rx="15" fill="#FF0033"/><path d="M-11 -15 L18 0 L-11 15 Z" fill="#fff"/></svg>
      <span class="plate">YouTube</span>
    </a>
    <a class="fl" data-i="2" style="left:29.99%;top:43.17%;width:20.35%;height:11.76%;--c:#25f4ee" href="https://www.tiktok.com/@TheQwyte">
      <span class="arch"></span>
      <svg viewBox="-50 -50 100 100" aria-hidden="true">
        <g transform="translate(-3 -3)"><path d="M6 -30 V12 a13 13 0 1 1 -13 -13" stroke="#25F4EE" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M6 -30 C9 -18 16 -13 27 -13" stroke="#25F4EE" stroke-width="9" fill="none" stroke-linecap="round"/></g>
        <g transform="translate(3 3)"><path d="M6 -30 V12 a13 13 0 1 1 -13 -13" stroke="#FE2C55" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M6 -30 C9 -18 16 -13 27 -13" stroke="#FE2C55" stroke-width="9" fill="none" stroke-linecap="round"/></g>
        <path d="M6 -30 V12 a13 13 0 1 1 -13 -13" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M6 -30 C9 -18 16 -13 27 -13" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="plate">TikTok</span>
    </a>
    <a class="fl" data-i="1" style="left:30.11%;top:60.59%;width:20.22%;height:11.75%;--c:#2aa9ec" href="https://t.me/TheQwyte">
      <span class="arch"></span>
      <svg viewBox="-50 -50 100 100" aria-hidden="true"><circle r="38" fill="#2AA9EC"/><g transform="translate(1 1) scale(2.15)"><path d="M-13 -1 L12 -11 Q14 -11.5 13.5 -9 L9 12 Q8.4 14 6.5 12.8 L0 8 L-3.5 11.5 Q-5 12.5 -5 10.5 L-5 4.5 L7 -6 L-8 3 L-13 1.5 Q-15 0.5 -13 -1 Z" fill="#fff"/></g></svg>
      <span class="plate">Telegram</span>
    </a>
    <a class="fl" data-i="0" style="left:30.23%;top:77.8%;width:20.1%;height:11.73%;--c:#d9cfb4" href="https://t.me/qwyt3">
      <span class="arch"></span>
      <svg viewBox="-50 -50 100 100" aria-hidden="true"><rect x="-32" y="-14" width="64" height="42" rx="6" fill="#e3dccb"/><path d="M-13 -14 V-22 Q-13 -27 -8 -27 H8 Q13 -27 13 -22 V-14" stroke="#e3dccb" stroke-width="6" fill="none"/><path d="M-32 4 H32" stroke="#06080c" stroke-width="3"/><rect x="-6" y="0" width="12" height="9" rx="2" fill="#06080c"/></svg>
      <span class="plate">Сотрудничество</span>
    </a>
  </div>

  <footer>© Qwyte</footer>
</main>

<nav class="pips" id="pips" aria-label="Этажи"></nav>
<div class="flash" id="flash" aria-hidden="true"></div>

<script>
(() => {
  const tower = document.getElementById('tower');
  const floors = [...document.querySelectorAll('.fl')];          // top → bottom
  const flash = document.getElementById('flash');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* pips on the right, one per floor */
  const pips = document.getElementById('pips');
  const pipBtns = floors.map(f => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', f.querySelector('.plate').textContent);
    b.style.setProperty('--c', f.style.getPropertyValue('--c'));
    b.innerHTML = '<i></i>';
    b.onclick = () => f.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    pips.appendChild(b);
    return b;
  });

  /* light up the floor nearest the middle of the screen */
  let active = -1, ticking = false;
  function pick() {
    ticking = false;
    const mid = innerHeight / 2;
    let best = 0, bd = Infinity;
    floors.forEach((f, i) => {
      const r = f.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid);
      if (d < bd) { bd = d; best = i; }
    });
    if (best === active) return;
    active = best;
    floors.forEach((f, i) => f.classList.toggle('on', i === best));
    pipBtns.forEach((b, i) => b.classList.toggle('on', i === best));
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(pick); } }, { passive: true });
  addEventListener('resize', pick);
  pick();

  /* tap: a floor that isn't lit gets scrolled to; a lit one dives in */
  let diving = false;
  floors.forEach((f, i) => f.addEventListener('click', e => {
    e.preventDefault();
    if (diving) return;
    if (i !== active) { f.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); return; }
    diving = true;
    const tr = tower.getBoundingClientRect(), r = f.querySelector('.arch').getBoundingClientRect();
    tower.style.transformOrigin = `${r.left + r.width / 2 - tr.left}px ${r.top + r.height * .45 - tr.top}px`;
    tower.classList.add('dive');
    flash.style.setProperty('--c', f.style.getPropertyValue('--c'));
    requestAnimationFrame(() => { tower.style.transform = 'scale(9)'; });
    setTimeout(() => flash.classList.add('on'), reduce ? 0 : 300);
    setTimeout(() => { location.href = f.href; }, reduce ? 30 : 720);
  }));

  /* coming back with the back button: undo the dive */
  addEventListener('pageshow', () => {
    if (!diving) return;
    diving = false;
    tower.classList.remove('dive'); tower.style.transform = ''; flash.classList.remove('on');
  });
})();
</script>
</body>
</html>
